# Publishes only the app's files to GitHub Pages (not tests, docs, tools or the roadmap).
# Needs Settings > Pages > Source = "GitHub Actions". Runs on every push to main, or by hand from the Actions tab.
name: Publish the app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the app files
        run: |
          mkdir _site
          cp index.html style.css app.js cloud.js sw.js manifest.webmanifest _site/
          cp -r icons vendor _site/
          # The live site never talks to the local test servers (emulators), so drop them from the page's address list.
          sed -i "s# http://127.0.0.1:9099 http://127.0.0.1:8080##" _site/index.html
          grep -q "127.0.0.1:9099" _site/index.html && exit 1 || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
